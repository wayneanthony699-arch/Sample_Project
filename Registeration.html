<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="reg-body">
    <div class="reg-container">
        <h2 class="reg-title">Create Account</h2>
        <form action="Homepage.html" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Example@email.com" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create your password" required><br>
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required><br>
            <button class="submit">🪪Register</button>
        </form>
        <p class="reg-link">Already have an account? <a href="Login.html">Login Here</a></p>
    </div>
</body>
</html>
